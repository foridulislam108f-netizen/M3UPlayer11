name: Build APK
on:
push:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Find project
run: |
Z=$(ls *.zip 2>/dev/null | head -1 || true)
if [ -n "$Z" ]; then mkdir -p _p && unzip -q -o "$Z" -d _p; fi
F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: 17
- uses: gradle/actions/setup-gradle@v3
with:
gradle-version: 8.11.1
- name: Build debug APK
run: |
cd "$PROJECT_DIR"
set +e
gradle assembleDebug --console=plain --warning-mode=none 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
CODE=${PIPESTATUS[0]}
exit $CODE
- name: Show the real error
if: failure()
run: |
{
echo "## Build error"
echo '```'
grep -n -E "^e: |error:|AAPT|What went wrong|Could not resolve|Execution failed|Caused by" -A6 build.log | head -80
echo '```'
} | tee -a $GITHUB_STEP_SUMMARY
- uses: actions/upload-artifact@v4
with:
name: M3UPlayer-APK
path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
